<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>量化策略選股器 (實戰版)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold;}
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-primary { background: #007bff; }
        .btn-primary:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #343a40; color: white; }
        .high-score { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 今日高勝率強勢股 Top 10</h1>
    <p>包含大盤多空濾網過濾、扣除 0.6% 交易手續費、近一年樣本外測試 (OOS)。</p>
    
    <button class="btn-danger" onclick="startScan()">1. 強制啟動全市場掃描 (背景抓資料)</button>
    <button class="btn-primary" onclick="fetchTop10()">2. 查詢今日 Top 10 排行榜</button>
    
    <p id="statusMsg" style="color: green; font-weight: bold;"></p>

    <table>
        <thead>
            <tr>
                <th>名次</th>
                <th>股票代碼</th>
                <th>今日綜合評分</th>
                <th>歷史總勝率</th>
                <th style="background-color: #28a745;">近一年實戰勝率 (OOS)</th>
                <th>扣除手續費淨報酬</th>
                <th>歷史觸發次數</th>
            </tr>
        </thead>
        <tbody id="resultBody">
            <tr><td colspan="7">請先點擊掃描，等待幾秒後再點擊查詢...</td></tr>
        </tbody>
    </table>
</div>

<script>
    function startScan() {
        document.getElementById('statusMsg').innerText = "背景掃描啟動中... 請等待約 10 秒後再點擊查詢。";
        fetch('/api/stocks/scan-now', { method: 'POST' })
            .then(response => response.text())
            .then(msg => console.log(msg));
    }

    function fetchTop10() {
        const resultBody = document.getElementById('resultBody');
        resultBody.innerHTML = '<tr><td colspan="7">資料載入中...</td></tr>';

        fetch('/api/stocks/top10')
            .then(response => response.json())
            .then(data => {
                resultBody.innerHTML = ''; 
                if (data.length === 0) {
                    resultBody.innerHTML = '<tr><td colspan="7">今日尚無符合高勝率標準的股票 (或大盤跌破季線觸發保護機制)</td></tr>';
                    return;
                }

                data.forEach((item, index) => {
                    const row = `<tr>
                        <td><strong># ${index + 1}</strong></td>
                        <td style="font-size: 1.1em; font-weight: bold;">${item.symbol}</td>
                        <td class="high-score">${item.score} 分</td>
                        <td>${item.winRate} %</td>
                        <td style="color: green; font-weight: bold;">${item.oosWinRate} %</td>
                        <td style="color: ${item.avgReturn > 0 ? 'red' : 'green'}; font-weight: bold;">
                            ${item.avgReturn > 0 ? '+' : ''}${item.avgReturn} %
                        </td>
                        <td>${item.totalSignals} 次</td>
                    </tr>`;
                    resultBody.innerHTML += row;
                });
                document.getElementById('statusMsg').innerText = "排行榜已更新！";
            })
            .catch(error => {
                console.error('錯誤:', error);
                resultBody.innerHTML = '<tr><td colspan="7">伺服器錯誤，請確認 Spring Boot 正在運行</td></tr>';
            });
    }
</script>

</body>
</html>
